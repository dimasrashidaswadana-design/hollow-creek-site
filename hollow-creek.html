function drawScareHead(id, p){
  const spec = BOTS[id];
  const h = 620;
  const u = h / 100;
  ctx.save();
  ctx.scale(u, u);
  const fur = mix(spec.fur, spec.furDark, 0.45);
  // skull
  ctx.fillStyle = fur;
  blob(ctx, 0, 0, 46, 46, 999, 15); ctx.fill();
  // open maw
  ctx.fillStyle = '#0a0708';
  ellipse(ctx, 0, 22, 26, 16 + p * 30); ctx.fill();
  teeth(ctx, -24, 6, 48, 12, 555, 'down');
  // lower jaw, hanging
  ctx.save();
  ctx.translate(0, 30 + p * 28); ctx.rotate(0.1 + p * 0.2);
  ctx.fillStyle = mix(fur, '#000', 0.3);
  ellipse(ctx, 0, 10, 26, 14); ctx.fill();
  teeth(ctx, -22, 0, 44, 12, 556, 'up');
  ctx.restore();
  // eyes: blown out
  for (const s of [-1, 1]){
    ctx.fillStyle = '#000';
    ellipse(ctx, s * 20, -12, 12, 12); ctx.fill();
    const eg = ctx.createRadialGradient(s*20, -12, 1, s*20, -12, 26);
    eg.addColorStop(0, 'rgba(255,255,245,1)');
    eg.addColorStop(0.3, 'rgba(255,210,120,.8)');
    eg.addColorStop(1, 'rgba(255,120,20,0)');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.arc(s * 20, -12, 26, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fffdf2';
    ctx.beginPath(); ctx.arc(s * 20, -12, 4.4, 0, TAU); ctx.fill();
  }
  // exposed skull through the face
  ctx.fillStyle = '#0b0a09';
  poly(ctx, [[-40, -30], [-8, -14], [6, 6], [40, -8], [30, -40], [-24, -44]]); ctx.fill();
  c_endo(spec, 900);
  wires(ctx, 0, 30, 9, 40, 777, ['#7a2b2b','#2f4a6b','#6b6f75','#7a6a2b','#2f6b4a']);
  decayLayers(ctx, spec, 44, 0, -6, 52, 46, 1, p * 10);
  ctx.restore();
  function c_endo(sp, seed){
    ctx.save();
    ctx.fillStyle = rgba(sp.metal, 0.9);
    ctx.lineWidth = 2.4; ctx.strokeStyle = rgba(sp.metal, 0.95);
    for (let i = -2; i <= 2; i++){
      ctx.beginPath();
      ctx.moveTo(i * 9 - 6, -20);
      ctx.quadraticCurveTo(i * 9, -8, i * 9 + 6, -20);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(0, -34); ctx.lineTo(0, 10); ctx.stroke();
    ctx.fillStyle = rgba('#b6bcc4', 0.7);
    for (let i = 0; i < 12; i++){
      const r2 = prng(seed + i)();
      ctx.beginPath(); ctx.arc((r2 - 0.5) * 66, (r2 * 60) - 28, 1.6, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

/* ================================================================== RENDER */
function render(ts){
  ctx.save();
  // screen shake
  if (G && G.shake > 0.4){
    ctx.translate(rnd(G.shake, -G.shake) * 0.5, rnd(G.shake, -G.shake) * 0.5);
  }
  hot = [];

  switch (G.screen){
    case 'menu':       drawTitle(); break;
    case 'nightIntro': drawNightIntro(); break;
    case 'office':
    case 'scare':
      {
        const dark = G.powerOut;
        drawOffice();
        // camera monitor over the office
        if (G.screen === 'office') drawMon();
        if (dark){
          const d2 = clamp(G.outT * 1.2, 0, 1);
          ctx.save();
          ctx.globalAlpha = d2 * 0.94;
          ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
          // the face arrives in the dark
          const t2 = clamp((G.outT - 1.2) / 5, 0, 1);
          if (t2 > 0){
            ctx.globalAlpha = d2 * t2 * (0.35 + 0.25 * Math.sin(G.t * 2.4));
            for (const s of [-1, 1]){
              const eg = ctx.createRadialGradient(W/2 + s * 120, H * 0.46, 2, W/2 + s * 120, H * 0.46, 90);
              eg.addColorStop(0, 'rgba(255,248,220,.95)');
              eg.addColorStop(0.35, 'rgba(255,180,60,.5)');
              eg.addColorStop(1, 'rgba(255,120,20,0)');
              ctx.fillStyle = eg;
              ctx.beginPath(); ctx.arc(W/2 + s * 120, H * 0.46, 90, 0, TAU); ctx.fill();
            }
            ctx.globalAlpha = d2 * t2 * 0.5;
            ctx.fillStyle = '#000';
            ctx.font = 'bold 20px "Courier New",monospace';
            ctx.textAlign = 'center';
            ctx.fillText('SOMETHING IS COMING DOWN THE HALL', W/2, H * 0.72);
            ctx.textAlign = 'left';
          }
          ctx.restore();
        }
        if (G.screen === 'office'){
          drawHUD();
          drawTape();
          drawHallu();
          drawGrain(ctx, 0.16, 1.0);
          drawScanlines(ctx, 0.3);
        }
      }
      break;
    case 'scare':      drawScare(); break;
    case 'dead':       drawDead(); break;
    case 'nightClear': drawNightClear(); break;
    default:           drawTitle();
  }

  // global vignette
  if (G.screen !== 'menu'){
    ctx.save();
    ctx.fillStyle = vigPat; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  ctx.restore();

  // hover cursor
  const h2 = hit(mouse.x, mouse.y);
  hoverId = h2 ? h2.id : null;
  CV.style.cursor = h2 ? 'pointer' : 'default';
}

/* ==================================================================== LOOP */
/* Fixed timestep so AI, power and the clock run at the same rate on any
   machine; rendering still happens once per animation frame. */
const STEP = 1 / 60;
let last = 0, acc = 0;
function frame(dt, t){
  acc += Math.min(dt, 0.25);
  let steps = 0;
  while (acc >= STEP && steps < 8){ update(STEP); acc -= STEP; steps++; }
  if (steps >= 8) acc = 0;
  render(t);
}
function loop(ts){
  const t = ts / 1000;
  const dt = last ? t - last : 0;
  last = t;
  frame(dt, t);
  requestAnimationFrame(loop);
}

/* ------------------------------------------------------------------- boot */
function buildUI(){ A.musicTimer = 0; A.musicStep = 0; A.musicRate = 0.52; }
window.__G = () => G;
window.__act = act;
window.__frame = frame;   // lets tooling run a full frame on demand
window.__step  = (dt, n) => { n = n || 1; for (let i = 0; i < n; i++) update(dt); };
window.__draw  = t => { render(t === undefined ? performance.now() / 1000 : t); };
requestAnimationFrame(loop);
</script>
